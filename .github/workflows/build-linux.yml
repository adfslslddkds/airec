name: Linux one-file build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth pulseaudio-utils xdg-utils libglib2.0-bin

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller==6.11.1

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run GUI smoke test
        run: xvfb-run -a python tests/gui_smoke.py

      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm airec.spec

      - name: Verify executable starts outside checkout
        run: |
          chmod +x dist/airec
          cd /tmp
          timeout 5s xvfb-run -a env -u LD_LIBRARY_PATH -u PYTHONHOME "$GITHUB_WORKSPACE/dist/airec" || test "$?" -eq 124

      - name: Package artifact and checksum
        run: |
          mkdir -p artifact
          tar -C dist -czf artifact/airec-linux-x86_64.tar.gz airec
          sha256sum artifact/airec-linux-x86_64.tar.gz > artifact/airec-linux-x86_64.tar.gz.sha256

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: airec-linux-x86_64
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
