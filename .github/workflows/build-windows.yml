name: Windows one-file build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller==6.11.1

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build one-file executable
        run: pyinstaller --clean --noconfirm airec.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/airec.exe")) {
            throw "PyInstaller did not produce dist/airec.exe"
          }

      - name: Package artifact and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Compress-Archive -Path dist/airec.exe -DestinationPath artifact/airec-windows-x86_64.zip -Force
          $hash = (Get-FileHash artifact/airec-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  airec-windows-x86_64.zip" | Set-Content artifact/airec-windows-x86_64.zip.sha256

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: airec-windows-x86_64
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
